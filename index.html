<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fountain of Life Church | Living Waters, Transforming Lives</title>
    <meta name="description" content="Welcome to Fountain of Life Church. Join us for inspiring Sunday worship, life-changing biblical teachings, vibrant ministries, prayer, and loving fellowship." />
    <meta property="og:title" content="Fountain of Life Church | Living Waters, Transforming Lives" />
    <meta property="og:description" content="Welcome to Fountain of Life Church. Join us for inspiring Sunday worship, life-changing biblical teachings, vibrant ministries, prayer, and loving fellowship." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-amber-100 selection:text-amber-900">
    <div id="root"></div>
    <script>
      (function () {
        function showStartupError(message) {
          var panel = document.getElementById('startup-error');
          if (!panel) {
            panel = document.createElement('pre');
            panel.id = 'startup-error';
            panel.style.cssText = 'position:fixed;z-index:999999;inset:16px;padding:20px;background:#fff1f2;color:#881337;border:2px solid #e11d48;border-radius:12px;white-space:pre-wrap;overflow:auto;font:14px/1.5 monospace';
            document.body.appendChild(panel);
          }
          panel.textContent = 'WEBSITE STARTUP ERROR\n\n' + message + '\n\nPlease send a screenshot of this message.';
        }
        window.addEventListener('error', function (event) {
          // Ignore image, stylesheet, and other resource-loading errors.
          // Only show this panel for actual JavaScript errors on the window.
          if (event.target !== window) return;
          showStartupError(event.message || 'A JavaScript error prevented the website from starting.');
        });
        window.addEventListener('unhandledrejection', function (event) {
          showStartupError(event.reason && (event.reason.stack || event.reason.message) || String(event.reason));
        });
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            showStartupError('The website JavaScript loaded, but React did not put anything on the page. This helps us locate the blank-screen problem.');
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
